<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>핑핑이 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
:root{--panel:#fffdf4;--ink:#2a2a3a;--accent:#ffcf4a;--line:#2a2a3a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#262a3a;--ink:#f3f1e6;--line:#f3f1e6}}
:root[data-theme="dark"]{--panel:#262a3a;--ink:#f3f1e6;--line:#f3f1e6}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:#1b2230;overflow:hidden;font-family:'Courier New',monospace;font-weight:700;image-rendering:pixelated}
canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,24,.6);image-rendering:pixelated}
#ov[hidden]{display:none}
.card{background:var(--panel);color:var(--ink);border:4px solid var(--line);border-radius:0;padding:20px;max-width:440px;width:100%;text-align:center;box-shadow:8px 8px 0 #0009}
.card h1,.card h2{margin:0 0 8px;font-weight:400}
.card p{margin:6px 0;line-height:1.5}
.btn{display:block;width:100%;font:inherit;font-size:1.05rem;color:#2a2a3a;background:var(--accent);border:3px solid var(--line);border-radius:0;padding:10px 14px;margin-top:10px;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #0005}
.btn.c{text-align:center}
.btn small{display:block;font-size:.85rem;opacity:.8}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* 흡혈귀 능력 툴팁: 포인터를 올리거나 키보드로 포커스할 때만 표시 */
.btn[data-job-tip]{position:relative;overflow:visible}
.btn[data-job-tip]::after{content:attr(data-job-tip);position:absolute;z-index:100;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%) translateY(4px);width:min(290px,82vw);padding:11px 13px;background:#101c30;color:#f5f8ff;border:2px solid #ff8bba;border-radius:6px;box-shadow:0 5px 18px #000b;font:600 13px/1.55 system-ui,sans-serif;white-space:pre-line;text-align:left;text-shadow:none;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease,transform .12s ease}
.btn[data-job-tip]:hover::after,.btn[data-job-tip]:focus-visible::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

.admin-card{max-height:88vh;overflow:auto}
.skill-choice-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.skill-choice{display:block;width:100%;min-height:68px;margin:0;text-align:left}
.level-card{max-height:88vh;overflow-y:auto}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff25}
.admin-row>div{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.admin-row .btn{font-size:12px;padding:8px 10px;margin:0}

/* GRAPHICS CLEANUP: consistent retro-pixel visual system */
:root{
  --panel:#17243a;
  --ink:#f4f7ff;
  --accent:#ffd45a;
  --line:#8da6c8;
}
html,body{
  background:#080f1d;
  color:#f4f7ff;
  font-family:'Jua',system-ui,'Courier New',monospace;
  letter-spacing:.15px;
}
canvas{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
#ov{
  padding:clamp(10px,3vw,28px);
  background:linear-gradient(135deg,rgba(3,8,18,.82),rgba(12,20,38,.72));
  backdrop-filter:blur(3px);
}
.card{
  color:#f4f7ff;
  background:linear-gradient(160deg,#243653 0%,#142238 100%);
  border:2px solid #7895bd;
  border-radius:8px;
  box-shadow:0 0 0 3px #091323,0 14px 40px #000b;
  padding:clamp(16px,3vw,24px);
  max-width:min(520px,94vw);
  text-shadow:0 2px 0 #07101d;
}
.card h1,.card h2{
  color:#ffe28a;
  font-weight:900;
  letter-spacing:.5px;
  text-shadow:2px 2px 0 #101a2c;
}
.card p{color:#e2ebfb;line-height:1.6}
.btn{
  color:#101a2b;
  background:linear-gradient(180deg,#ffe68a,#f4b936);
  border:2px solid #fff0b8;
  border-radius:5px;
  padding:11px 14px;
  margin-top:9px;
  font-weight:900;
  box-shadow:0 4px 0 #98651c,0 6px 12px #0005;
  transition:filter .12s ease,transform .12s ease,box-shadow .12s ease;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 0 #98651c,0 8px 14px #0006}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #98651c}
.btn:focus-visible{outline:3px solid #7be8ff;outline-offset:3px}
.admin-card{max-height:88vh;overflow:auto;scrollbar-color:#7895bd #142238}
.admin-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:11px 2px;border-bottom:1px solid #7895bd55;
}
.admin-row b{color:#f4f7ff;font-size:14px}
.admin-row>div{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.admin-row .btn{width:auto;min-width:104px;font-size:12px;padding:8px 10px;margin:0}
@media(max-width:520px){
  .admin-row{align-items:flex-start;flex-direction:column}
  .admin-row>div{width:100%;justify-content:stretch}
  .admin-row .btn{flex:1;min-width:0}
  .card{max-height:92vh;overflow:auto}
}

/* Clean, restrained pixel UI */
#ov{background:rgba(5,10,20,.78);backdrop-filter:none}
.card{background:#18263b;border:2px solid #607b9e;border-radius:6px;box-shadow:0 6px 20px #0009;text-shadow:none}
.card h1,.card h2{color:#ffe08a;text-shadow:none}
.btn{background:#e9bd52;border:1px solid #fff0b0;border-radius:4px;box-shadow:none;transform:none}
.btn:hover,.btn:active{transform:none;box-shadow:none;filter:brightness(1.06)}

.comic-wrap{width:min(1050px,96vw);max-height:94vh;overflow:auto;padding:14px;background:#111d31;border:2px solid #8db5df;border-radius:8px;color:#f5f8ff;text-align:center;box-shadow:0 10px 40px #000b}
.comic-wrap h2{margin:4px 0;color:#ffe28a;font-size:clamp(18px,3vw,28px)}.comic-sub{margin:4px 0 12px;color:#c8dcf7}
.comic-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.comic-panel{position:relative;min-height:170px;padding:10px 8px;border:2px solid #d4e4fa;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 0 24px #0004}
.comic-no{position:absolute;top:5px;left:7px;font-size:11px;color:#fff;background:#0008;padding:3px 5px;border-radius:3px}
.comic-art{font-size:clamp(34px,5vw,58px);filter:drop-shadow(0 4px 3px #0008)}.comic-panel b{font-size:clamp(13px,1.6vw,17px);color:#fff}.comic-panel small{font-size:clamp(10px,1.2vw,13px);line-height:1.35;color:#f3f7ff;font-weight:600}
@media(max-width:650px){.comic-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.comic-panel{min-height:140px;padding:8px 5px}.comic-wrap{padding:9px}}

</style>
</head>

function activateChosenWeapon(){
  if(!chosenWeapon||bladeCooldown>0||!p)return;
  var targetX=aimX-W/2+p.x,targetY=aimY-H/2+p.y;
  if(chosenWeapon==='gun'){
    var dx=targetX-p.x,dy=targetY-p.y,ang=Math.atan2(dy,dx);
    if(weaponLv>=5){
      // 총 Lv.5 궁극기: 플레이어를 중심으로 네 방향에 블랙홀을 하나씩 발사합니다.
      var ultimateCount=4,ultimateSpeed=430;
      for(var i=0;i<ultimateCount;i++){
        var a=-Math.PI/2+i*(Math.PI*2/ultimateCount);
        bl.push({x:p.x,y:p.y,vx:Math.cos(a)*ultimateSpeed,vy:Math.sin(a)*ultimateSpeed,life:2.8,pc:99,hit:[],kind:'blackhole',dmg:st.dmg*2.2});
      }
      toast={s:'🌀 블랙홀 궁극기! 주변으로 4개 발사!',l:2};
    }else{
      var pellets=7+Math.floor(weaponLv/2),spread=.48;
      for(var i=0;i<pellets;i++){
        var a=ang+(i-(pellets-1)/2)*(spread/Math.max(1,pellets-1));
        bl.push({x:p.x,y:p.y,vx:Math.cos(a)*(650+weaponLv*35),vy:Math.sin(a)*(650+weaponLv*35),life:1.15,pc:0,hit:[],kind:'bullet',dmg:st.dmg*(1.15+weaponLv*.18)});
      }
      toast={s:'🔫 샷건 발사! '+pellets+'발 발사 · 재사용 대기 15초',l:1.8};
    }
    bladeFxX=aimX;bladeFxY=aimY;bladeFxLife=.22;bladeFx=bladeFxLife;
  }else if(chosenWeapon==='sword'){
    // R키를 누르고 있는 동안 원형-부채꼴 공격을 두 번씩 연속 발동합니다.
    swordComboActive=true;swordComboAuto=false;swordComboTimer=0;swordComboStep=0;
    swordFxAngle=Math.atan2(targetY-p.y,targetX-p.x);
    toast={s:'🔥 불꽃검 연속 발동! 원형 2회 + 부채꼴 2회',l:2};
    return;
  }
  bladeCooldown=15;
}

  if(ban>0){cx.fillStyle='rgba(0,0,0,'+Math.min(.65,ban)+')';cx.fillRect(0,H*.28,W,bt.length>1?84:64);tx(bt[0],W/2,H*.28+(bt.length>1?28:32),30,'center');if(bt[1])tx(bt[1],W/2,H*.28+62,22,'center','#ffd54a')}
  if(toast&&toast.l>0)tx(toast.s,W/2,H*.78,18,'center','#ffd54a');
  if(joy){cx.strokeStyle='#fff6';cx.lineWidth=2;cx.beginPath();cx.arc(joy.sx,joy.sy,50,0,6.283);cx.stroke();
    var jl=Math.hypot(joy.x-joy.sx,joy.y-joy.sy),k=jl>50?50/jl:1;
    cx.fillStyle='#fff8';cx.beginPath();cx.arc(joy.sx+(joy.x-joy.sx)*k,joy.sy+(joy.y-joy.sy)*k,18,0,6.283);cx.fill()}
}
reset();
function loop(n){var dt=Math.min(.05,(n-last)/1000);last=n;if(S==='play')upd(dt);draw();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
